<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <title>セキオプレッシャー</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- 消音ボタン（どの画面でも右上） -->
  <button id="btn-mute" class="icon-btn hud-mute" type="button">
    <svg class="ic-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <svg class="ic-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>

  <!-- タイトル画面 -->
  <section id="screen-title" class="screen active">
    <div class="title-wrap">
      <p class="kicker" data-t="title.kicker"></p>
      <svg class="title-art" viewBox="0 0 200 170" aria-hidden="true">
        <circle cx="34" cy="52" r="9" class="mol"/>
        <circle cx="170" cy="40" r="12" class="mol"/>
        <circle cx="160" cy="120" r="7" class="mol"/>
        <circle cx="42" cy="128" r="6" class="mol"/>
        <ellipse cx="100" cy="160" rx="40" ry="6" class="shadow"/>
        <rect x="88" y="10" width="24" height="8" rx="4" class="navy"/>
        <rect x="95" y="16" width="10" height="12" class="navy"/>
        <rect x="68" y="26" width="64" height="130" rx="28" class="body"/>
        <rect x="70" y="72" width="60" height="22" class="navy"/>
        <text x="100" y="88" class="band">P</text>
        <path d="M82 44 v18" class="shine"/>
        <circle cx="100" cy="122" r="16" class="gauge"/>
        <path d="M100 122 L110 112" class="needle"/>
        <circle cx="100" cy="122" r="3" class="navy"/>
      </svg>
      <h1 class="title-main"><span data-t="title.main1"></span><span data-t="title.main2"></span></h1>
      <p class="title-en" data-t="title.en"></p>
      <div class="title-buttons">
        <button id="btn-play" class="btn btn-primary" type="button">
          <span data-t="title.play"></span>
          <small data-t="title.playSub"></small>
        </button>
        <button id="btn-calib" class="btn btn-secondary" type="button" data-t="title.calib"></button>
      </div>
      <p class="note" data-t="title.soundNote"></p>
    </div>
    <p id="version" class="version"></p>
  </section>

  <!-- 音ずれ調整 -->
  <section id="screen-calib" class="screen">
    <div class="calib-wrap">
      <h2 data-t="calib.heading"></h2>
      <p id="calib-first" class="calib-first" data-t="calib.firstTime"></p>
      <p class="calib-howto" data-t="calib.howto"></p>
      <button id="calib-pad" class="calib-pad" type="button">
        <span id="calib-pad-label" data-t="calib.pad"></span>
      </button>
      <div id="calib-dots" class="calib-dots"></div>
      <p id="calib-status" class="calib-status"></p>
      <div id="calib-result" class="calib-result" hidden>
        <p id="calib-offset" class="calib-offset"></p>
        <p id="calib-spread" class="calib-spread"></p>
      </div>
      <div class="calib-buttons">
        <button id="calib-accept" class="btn btn-primary" type="button" data-t="calib.accept" hidden></button>
        <button id="calib-retry" class="btn btn-secondary" type="button" data-t="calib.retry"></button>
        <button id="calib-skip" class="btn btn-text" type="button" data-t="calib.skip"></button>
      </div>
    </div>
  </section>

  <!-- プレイ画面 -->
  <section id="screen-play" class="screen">
    <canvas id="game"></canvas>
    <button id="btn-pause" class="icon-btn hud-pause" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg>
    </button>
    <div id="answer-row" class="answer-row">
      <button class="ans" type="button" data-i="0"></button>
      <button class="ans" type="button" data-i="1"></button>
      <button class="ans" type="button" data-i="2"></button>
      <button class="ans" type="button" data-i="3"></button>
    </div>

    <div id="overlay-pause" class="overlay" hidden>
      <div class="panel">
        <h2 data-t="pause.title"></h2>
        <button id="btn-resume" class="btn btn-primary" type="button" data-t="pause.resume"></button>
        <button id="btn-quit" class="btn btn-secondary" type="button" data-t="pause.quit"></button>
      </div>
    </div>

    <div id="overlay-result" class="overlay" hidden>
      <div class="panel">
        <h2 data-t="result.title"></h2>
        <dl id="result-list" class="result-list"></dl>
        <button id="btn-retry" class="btn btn-primary" type="button" data-t="result.retry"></button>
        <button id="btn-to-title" class="btn btn-secondary" type="button" data-t="result.toTitle"></button>
      </div>
    </div>
  </section>

  <div id="rotate" class="rotate"><p data-t="rotate"></p></div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
